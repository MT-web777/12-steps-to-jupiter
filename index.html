<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>木星に向かう12のステップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --space: #0e1224;
    --band-1: #c9a66b;
    --band-2: #8a6a45;
    --cream: #ede3cf;
    --dusk: #5b6ba8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--space);
    color: var(--cream);
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  main { width: 100%; max-width: 480px; text-align: center; }

  /* 木星の縞：ここだけ凝る */
  .bands {
    height: 96px;
    margin: 0 auto 40px;
    border-radius: 48px;
    background: linear-gradient(
      to bottom,
      var(--band-2) 0 14%,
      var(--band-1) 14% 30%,
      var(--cream) 30% 38%,
      var(--band-2) 38% 52%,
      var(--band-1) 52% 70%,
      var(--band-2) 70% 82%,
      var(--band-1) 82% 100%
    );
    width: 96px;
  }

  h1 {
    font-size: clamp(1.5rem, 6vw, 2rem);
    font-weight: 700;
    letter-spacing: 0.08em;
    line-height: 1.5;
    margin: 0 0 40px;
  }

  #message { animation: fade 0.8s ease both; }
  #message p { margin: 0; line-height: 2; font-size: 1.05rem; }
  #message .main { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.06em; }
  #message .sub { margin-top: 20px; color: var(--band-1); font-size: 0.95rem; }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    #message { animation: none; }
  }
</style>
</head>
<body>
<main>
  <div class="bands" aria-hidden="true"></div>
  <h1>木星に向かう12のステップ</h1>

  <div id="message">
    <p class="main">さらにパワーアップ調整します。<br>また遊べる日まで！</p>
    <!-- ゲムマの案内を出したいときは、下の行のコメントを外す（リンクなし・文字のみ） -->
    <!-- <p class="sub">ゲムマ秋2026 M005で実物を頒布します</p> -->
  </div>
</main>

</body>
</html>
