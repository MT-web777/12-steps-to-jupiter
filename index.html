// 交信エリアの交換で「どの手札カードを手放すか」を賢く選ぶ
// 単純な最小値固定ではなく、現在の狙い（intendedRank）と手札構成を見て判断
function chooseHandCardToSwap(p, incomingCard){
  if(!p.hand.length) return 0;
  var pi = G.players.indexOf(p);
  var sorted = p.hand.map(function(c,i){ return {c:c, i:i}; }).sort(function(a,b){ return a.c.value-b.c.value; });
  var intended = aiIntendedRankCooperative(p, pi);

  // 狙いが上段（大きいカードを温存したい）→ 最小カードを手放す
  if(intended === 0){
    return sorted[0].i;
  }
  // 狙いが下段（小さいカードを温存したい）→ 最大カードを手放す
  if(intended === 2 || intended === -1){
    return sorted[sorted.length-1].i;
  }
  // 狙いが中段、または手札が極端に偏っている場合：
  // 入ってくるカードの価値を踏まえ、手札の中で最も「使い道が薄い」カードを選ぶ
  var highCount = p.hand.filter(function(c){ return c.value > 30; }).length;
  var lowCount = p.hand.filter(function(c){ return c.value <= 15; }).length;
  // ハイカードに偏りすぎていれば最大値を整理
  if(highCount >= p.hand.length * 0.6){
    return sorted[sorted.length-1].i;
  }
  // ローカードに偏りすぎていれば最小値を整理
  if(lowCount >= p.hand.length * 0.6){
    return sorted[0].i;
  }
  // それ以外は手札平均から最も離れたカードを手放す（バランス調整）
  var avg = handAvg(p.hand);
  var worstIdx = sorted[0].i, worstDiff = -1;
  p.hand.forEach(function(c,i){
    var diff = Math.abs(c.value - avg);
    if(diff > worstDiff){ worstDiff = diff; worstIdx = i; }
  });
  return worstIdx;
}

function execAction(pi,rank,dec,playedCard){
  var p=G.players[pi]; var noDiscard=false; var logType=p.isHuman?'you':'ai';

  if(dec.act==='move'){
    var fromEdge=dec.fromEdge; var steps=dec.steps; var toEdge=moveEdge(fromEdge,steps);
    var fromStack=p.obs.stacks[fromEdge]||[];

    // 移動するカードがない場合はpassとして扱う（フリーズ防止）
    if(fromStack.length===0){
      addLog(p.name+'：移動先にカードなし→スキップ',logType);
      G.opos++; G.phase=PH.RESOLVE; setAP('待機中',[]); render(); setTimeout(nextStep,300);
      return;
    }

    var movingCard=fromStack.pop();

    // 発射台を通過・到着（到着も含む）したら裏返す
    var le=launchEdge(p.obs);
    var fi=EDGES.indexOf(fromEdge); var li=EDGES.indexOf(le);
    var passesLaunch=false;
    for(var s=1;s<=steps;s++){ if((fi+s)%4===li){ passesLaunch=true; break; } }
    if(passesLaunch && movingCard){
      movingCard.faceUp=!movingCard.faceUp;
      addLog(p.name+'：発射台通過 → カード裏返し（'+movingCard.value+'）',logType);
    }

    if(!p.obs.stacks[toEdge]) p.obs.stacks[toEdge]=[];
    if(movingCard) p.obs.stacks[toEdge].push(movingCard);

    var area=edgeArea(p.obs,toEdge);
    addLog(p.name+'：'+steps+'辺移動（'+AREA_LABEL[edgeArea(p.obs,fromEdge)]+'→'+AREA_LABEL[area]+'）',logType);

    // ===== 衛星ボーナス判定 =====
    // 最初にtop辺に裏向きカードを置いたプレイヤー → 木星衛星（+7点）
    if(movingCard && !movingCard.faceUp && toEdge==='top' && G.jupiterBonus===null){
      G.jupiterBonus = pi;
      addLog('🪐 '+p.name+'が木星衛星ボーナス(+7点)を獲得！','imp');
      render();
    }
    // 最初にleft辺に裏向きカードを置いたプレイヤー → 火星衛星（+3点）
    if(movingCard && !movingCard.faceUp && toEdge==='left' && G.marsBonus===null){
      G.marsBonus = pi;
      addLog('🔴 '+p.name+'が火星衛星ボーナス(+3点)を獲得！','imp');
      render();
    }

    // 建設：3枚→金色化
    if(area==='construction' && !p.obs.isGold && (p.obs.stacks[toEdge]||[]).length>=3){
      p.obs.isGold=true; addLog(p.name+'の天文台が金色になった！','imp');
      if(G.stats && G.stats[pi] && G.stats[pi].goldRound===null) G.stats[pi].goldRound=G.round;
    }

    // 開発（灰色）：到着時に表向きが2枚以上あれば毎回playedCardを発射台へ（裏向きはカウント対象外）
    if(area==='development' && !p.obs.isGold && faceUpCount(p.obs.stacks[toEdge])>=2 && playedCard){
      var newLe=launchEdge(p.obs);
      if(!p.obs.stacks[newLe]) p.obs.stacks[newLe]=[];
      p.obs.stacks[newLe].push(Object.assign({},playedCard,{faceUp:true}));
      addLog(p.name+'：開発エリア効果 → '+playedCard.value+'を発射台へ',logType);
      noDiscard=true;
    }

    // 開発（金色）：止まった瞬間に出したカードを発射台へ
    if(area==='development' && p.obs.isGold && playedCard){
      var newLe2=launchEdge(p.obs);
      if(!p.obs.stacks[newLe2]) p.obs.stacks[newLe2]=[];
      p.obs.stacks[newLe2].push(Object.assign({},playedCard,{faceUp:true}));
      addLog(p.name+'：開発エリア効果（金）→ '+playedCard.value+'を発射台へ',logType);
      noDiscard=true;
    }

    // 遭遇（金色のみ）：捨て札から1枚手札に
    if(area==='encounter'){
      if(G.discard.length>0){
        if(!p.isHuman){
          // 自分のplayedCardがまだ捨て札に積まれていないことを保証した上で取得
          var idxToTake = G.discard.length-1;
          if(playedCard && G.discard[idxToTake].id===playedCard.id && G.discard[idxToTake].value===playedCard.value){
            // 万一自分のカードが最後尾にある場合はその前のカードを探す
            idxToTake = -1;
            for(var di=G.discard.length-1; di>=0; di--){
              if(!(playedCard && G.discard[di].id===playedCard.id && G.discard[di].value===playedCard.value)){ idxToTake=di; break; }
            }
          }
          if(idxToTake>=0){
            var t=G.discard.splice(idxToTake,1)[0];
            p.hand.push(t); addLog(p.name+'：遭遇エリア効果 → '+t.value+'を手札に',logType);
          } else {
            addLog(p.name+'：遭遇エリア（取れるカードなし）',logType);
          }
        } else {
          if(!noDiscard && playedCard) G.discard.push(playedCard);
          G.opos++; render(); showDiscardSelectUI(pi,rank,null,'take',playedCard); return;
        }
      } else { addLog(p.name+'：遭遇エリア（捨て札なし）',logType); }
    }

    // 交信エリア（灰色左辺）：移動でカードが到着した場合、手札と捨て札を交換
    if(area==='contact' && p.hand.length>0 && G.discard.length>0){
      if(!p.isHuman){
        var dcIdx2 = G.discard.length-1;
        if(playedCard && G.discard[dcIdx2].id===playedCard.id && G.discard[dcIdx2].value===playedCard.value){
          dcIdx2 = -1;
          for(var dj2=G.discard.length-1; dj2>=0; dj2--){
            if(!(playedCard && G.discard[dj2].id===playedCard.id && G.discard[dj2].value===playedCard.value)){ dcIdx2=dj2; break; }
          }
        }
        if(dcIdx2>=0){
          var dc2=G.discard.splice(dcIdx2,1)[0];
          var swapHandIdx = chooseHandCardToSwap(p, dc2);
          var oldCard = p.hand.splice(swapHandIdx,1)[0];
          G.discard.push(oldCard); p.hand.push(dc2);
          addLog(p.name+'：交信エリア効果 → 手札の'+oldCard.value+'と捨て札の'+dc2.value+'を交換',logType);
        } else {
          addLog(p.name+'：交信エリア（交換できるカードなし）',logType);
        }
      } else {
        if(!noDiscard && playedCard) G.discard.push(playedCard);
        G.opos++; render(); showSwapDiscardUI(pi,rank,null,playedCard); return;
      }
    } else if(area==='contact'){
      addLog(p.name+'：交信エリア（交換できるカードなし）',logType);
    }
  }
  else if(dec.act==='develop'){
    if(playedCard){
      var dle=launchEdge(p.obs);
      if(!p.obs.stacks[dle]) p.obs.stacks[dle]=[];
      p.obs.stacks[dle].push(Object.assign({},playedCard,{faceUp:true}));
      noDiscard=true;
      addLog(p.name+'：ロケット開発 → '+playedCard.value+'を発射台へ',logType);
    }
  }
  else if(dec.act==='take_discard'){
    if(G.discard.length>0){
      var idx=dec.discIdx!==undefined?dec.discIdx:G.discard.length-1;
      var tk=G.discard.splice(idx,1)[0]; p.hand.push(tk);
      addLog(p.name+'：捨て札から'+tk.value+'を手札に',logType);
    }
  }
  else if(dec.act==='swap_discard'){
    if(G.discard.length>0 && p.hand.length>0){
      var discIdx=dec.discIdx!==undefined?dec.discIdx:G.discard.length-1;
      var discCard=G.discard.splice(discIdx,1)[0];
      var handIdx=dec.handIdx!==undefined?dec.handIdx:(function(){ var mi=0; p.hand.forEach(function(c,i){ if(c.value<p.hand[mi].value) mi=i; }); return mi; })();
      var removed=p.hand.splice(handIdx,1)[0];
      G.discard.push(removed); p.hand.push(discCard);
      addLog(p.name+'：手札の'+removed.value+'と捨て札の'+discCard.value+'を交換',logType);
    }
  }
  else if(dec.act==='pass'){ addLog(p.name+'：パス',logType); }

  if(!noDiscard && playedCard) G.discard.push(playedCard);
  G.opos++; G.phase=PH.RESOLVE; setAP('待機中',[]); render(); setTimeout(nextStep,300);
}

function endRound(){
  if(G.players.some(function(p){return p.hand.length===0;})){ gameOver(); return; }
  // 前ラウンドの1位（G.order[0]）が次のスタートプレイヤー
  if(G.order.length>0) G.startIdx=G.order[0];
  G.round++; G.played=[]; G.order=[]; G.opos=0; G.phase=PH.DEAL;
  addLog('--- ラウンド'+G.round+' スタート：'+G.players[G.startIdx].name+' ---','imp');
  render(); setTimeout(nextStep,200);
}

function gameOver(){
  G.phase=PH.OVER; render();
  var scores=G.players.map(function(p,i){
    return {name:p.name, score:calcScore(p), pi:i, p:p};
  }).sort(function(a,b){return b.score-a.score;});

  addLog('=== ゲーム終了 ===','imp');
  scores.forEach(function(s){ addLog(s.name+'：'+s.score+'点'); });
  addLog('勝者：'+scores[0].name,'imp');

  // ---- プレイヤー向けハイライト（自然文） ----
  var highlights = [];
  highlights.push(G.jupiterBonus!==null
    ? '🪐 木星衛星ボーナスは'+G.players[G.jupiterBonus].name+'が獲得'
    : '🪐 木星衛星ボーナスは誰も獲得できなかった');
  highlights.push(G.marsBonus!==null
    ? '🔴 火星衛星ボーナスは'+G.players[G.marsBonus].name+'が獲得'
    : '🔴 火星衛星ボーナスは誰も獲得できなかった');
  var goldTexts = G.players.map(function(p,i){
    var st=G.stats[i];
    return p.name+'（'+(st.goldRound?'R'+st.goldRound+'で金色化':'金色化できず')+'）';
  });
  highlights.push('✨ '+goldTexts.join('　'));

  showGameOverModal(scores, highlights);

  // ---- 開発者向け詳細診断（プレイヤーのログには出さず、コンソールのみ） ----
  function edgePoints(stack, edge){
    var cardEdge = OPPOSITE[edge];
    var faceDown=0, faceUp=0, pts=0;
    stack.forEach(function(c){
      var v=(c.faceUp?c.front:c.back)[cardEdge]||0;
      pts+=v;
      if(c.faceUp) faceUp++; else faceDown++;
    });
    return {pts:pts, faceUp:faceUp, faceDown:faceDown, total:stack.length};
  }
  var report = scores.map(function(s){
    var st = G.stats[s.pi];
    var p = s.p;
    var topInfo = edgePoints(p.obs.stacks['top']||[], 'top');
    var leftInfo = edgePoints(p.obs.stacks['left']||[], 'left');
    var goldRound = st.goldRound ? 'R'+st.goldRound+'で金色化' : '金色化できず';
    var rankStr = '上'+st.rankWins[0]+'回/中'+st.rankWins[1]+'回/下'+st.rankWins[2]+'回';
    return s.name+'：'+s.score+'点\n'
      +'  '+goldRound+'\n'
      +'  アクション権：'+rankStr+'\n'
      +'  top辺'+topInfo.total+'枚(裏'+topInfo.faceDown+'/表'+topInfo.faceUp+' 実質'+topInfo.pts+'点) '
      +'left辺'+leftInfo.total+'枚(裏'+leftInfo.faceDown+'/表'+leftInfo.faceUp+' 実質'+leftInfo.pts+'点)\n'
      +'  手札残'+p.hand.length+'枚(+'+(p.hand.length*2)+'点)';
  }).join('\n\n');
  console.debug('[Jupiter12 診断レポート]\n'+report);
}

// ========== ゲーム終了モーダル（木星到達演出） ==========
function showGameOverModal(scores, highlights){
  var rows = scores.map(function(s,i){
    return '<div class="mf-score-row'+(i===0?' winner':'')+'">'
      +'<span class="mf-name">'+(i===0?'🏆 ':'')+s.name+'</span>'
      +'<span class="mf-num" data-target="'+s.score+'">0点</span></div>';
  }).join('');
  document.getElementById('mf-scores').innerHTML = rows;
  document.getElementById('mf-highlights').innerHTML = highlights.map(function(h){ return '<div>'+h+'</div>'; }).join('');
  document.getElementById('modal-final').classList.add('show');

  // スコアのカウントアップ演出
  var nums = document.querySelectorAll('#mf-scores .mf-num');
  nums.forEach(function(el){
    var target = parseInt(el.getAttribute('data-target'),10) || 0;
    var duration = 700, startTime = null;
    function step(ts){
      if(!startTime) startTime = ts;
      var progress = Math.min((ts-startTime)/duration, 1);
      el.textContent = Math.round(target*progress)+'点';
      if(progress < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}


// ========== 描画 ==========
function getAiStrategy(p, pi){
  var intended = aiIntendedRankCooperative(p, pi);
  if(intended === -1) return '手札圧縮';
  if(!p.obs.isGold){
    var devSt = (p.obs.stacks['top']||[]).length;
    if(intended === 1) return '開発投資（top辺蓄積）';
    if(intended === 2) return '建設優先（金色化へ）';
    return '上段（建設加速）';
  } else {
    var topSt = (p.obs.stacks['top']||[]).length;
    var leftSt = (p.obs.stacks['left']||[]).length;
    if(p.hand.length>=8) return '手札温存';
    if(topSt < 3) return '顕彰狙い（top埋め）';
    if(leftSt < 4) return '遭遇狙い（left埋め）';
    return '積み増し';
  }
}

function pad2(n){ return n<10?'0'+n:''+n; }

function renderObs(key,p){
  var obs=document.getElementById('obs-'+key); if(!obs) return;
  if(p.obs.isGold) obs.classList.add('gold'); else obs.classList.remove('gold');
  var face=p.obs.isGold?'gold':'gray';
  var isHuman=(key==='human');
  var peekH = isHuman ? 20 : 12;
  var cardH = isHuman ? 89 : 35;
  var cardW = isHuman ? 57 : 22;
  var selectMode = isHuman && G_cardSelect !== null;

  EDGES.forEach(function(edge){
    var el=document.getElementById('oe-'+key+'-'+edge); if(!el) return;
    var bonusTileEl = el.querySelector('.bonus-tile');
    var bonusTileHtml = bonusTileEl ? bonusTileEl.outerHTML : '';
    var area=OBS_LAYOUT[face][edge];
    var stack=p.obs.stacks[edge]||[];
    var html='<span class="edge-label">'+AREA_LABEL[area]+'</span>';

    if(stack.length>0){
      var totalH=cardH+(stack.length-1)*peekH;
      var selectable = selectMode && stack.length>0;
      var tapAttr = selectable ? ' onclick="tapObsCard(\''+edge+'\')" style="cursor:pointer;top:' : ' style="top:';

      html+='<div class="obs-stack" style="width:'+cardW+'px;height:'+totalH+'px;">';
      stack.forEach(function(card,i){
        var top=i*peekH;
        var isTop=(i===stack.length-1);
        var glowStyle = (selectable && isTop) ? 'box-shadow:0 0 10px 3px #f0d060;border-color:#f0d060;' : '';

        if(isHuman){
          var clickAttr = (selectable && isTop) ? ' onclick="tapObsCard(\''+edge+'\')" style="cursor:pointer;top:'+top+'px;z-index:'+i+';'+glowStyle+'"' : ' style="top:'+top+'px;z-index:'+i+';"';
          if(card.faceUp)
            html+='<div class="rocket-bridge"'+clickAttr+'><img src="card '+pad2(card.id)+' front.jpg" onerror="this.style.display=\'none\'"><span class="cnum show">'+card.value+'</span></div>';
          else
            html+='<div class="rocket-bridge face-down"'+clickAttr+'><img src="card back 01-56.jpg" onerror="this.style.display=\'none\'"><span class="cnum show">裏</span></div>';
        } else {
          if(card.faceUp)
            html+='<div class="rocket-mini" style="top:'+top+'px;z-index:'+i+'"><img src="card '+pad2(card.id)+' front.jpg" onerror="this.style.display=\'none\';this.parentNode.querySelector(\'span\').style.display=\'block\';"><span style="display:none;font-size:7px;">'+card.value+'</span></div>';
          else
            html+='<div class="rocket-mini face-down" style="top:'+top+'px;z-index:'+i+'"><img src="card back 01-56.jpg" onerror="this.style.display=\'none\'"><span style="display:none;font-size:7px;">裏</span></div>';
        }
      });
      html+='</div>';
    }
    el.innerHTML=bonusTileHtml+html; el.style.background='';
  });
}

// ===== 衛星ボーナス達成報酬タイルの状態更新 =====
function renderBonusTiles(){
  if(!G) return;
  var keys=['human','ai1','ai2'];
  keys.forEach(function(key,pi){
    var jt=document.getElementById('bt-'+key+'-top');
    if(jt){
      jt.className='bonus-tile bonus-tile-jupiter';
      if(G.jupiterBonus===null) jt.classList.add('unclaimed');
      else if(G.jupiterBonus===pi) jt.classList.add('claimed-here');
      else jt.classList.add('claimed-elsewhere');
    }
    var mt=document.getElementById('bt-'+key+'-left');
    if(mt){
      mt.className='bonus-tile bonus-tile-mars';
      if(G.marsBonus===null) mt.classList.add('unclaimed');
      else if(G.marsBonus===pi) mt.classList.add('claimed-here');
      else mt.classList.add('claimed-elsewhere');
    }
  });
}

function renderHand(p){
  var area=document.getElementById('hand-area'); area.innerHTML='';
  var canSelect=(G.phase===PH.DEAL&&!G.played.find(function(e){return e.pi===0;}));
  var sorted=p.hand.map(function(c,i){return {card:c,idx:i};}).sort(function(a,b){return a.card.value-b.card.value;});
  sorted.forEach(function(item){
    var el=document.createElement('div');
    el.className='card'+(canSelect?' selectable':'');

    // 長押し（400ms）で拡大
    var pressTimer=null;
    el.addEventListener('touchstart',function(){
      pressTimer=setTimeout(function(){ showCardZoom(item.card); },400);
    },{passive:true});
    el.addEventListener('touchmove',function(){ clearTimeout(pressTimer); },{passive:true});
    el.addEventListener('touchend',function(){ clearTimeout(pressTimer); },{passive:true});
    // 右クリックでも拡大
    el.addEventListener('contextmenu',function(e){ e.preventDefault(); showCardZoom(item.card); });

    if(canSelect){
      (function(idx){ el.addEventListener('click',function(){ humanPlay(idx); }); })(item.idx);
    } else {
      el.addEventListener('click',function(){ showCardZoom(item.card); });
    }

    var img=document.createElement('img');
    img.src='card '+pad2(item.card.id)+' front.jpg';
    var num=document.createElement('div');
    num.className='cnum'; num.textContent=item.card.value;
    img.onerror=function(){ this.style.display='none'; num.classList.add('show'); };
    el.appendChild(img);
    el.appendChild(num);
    area.appendChild(el);
  });
}

// 手札カードサイズを動的計算（12枚が必ず収まるよう）
function resizeHandCards(){
  var col = document.getElementById('hand-col');
  var handArea = document.getElementById('hand-area');
  var centerArea = document.getElementById('center-area');
  if(!col||!handArea) return;

  var isMobile = window.innerWidth <= 760;
  var colW = col.clientWidth - 12; // padding分
  var cardW, cardH;

  if(isMobile){
    // スマホ：縦幅に合わせて縮めない。横幅基準で大きめに固定し、
    // 収まりきらない分は hand-area の縦スクロールに任せる。
    var mobileCols = colW < 340 ? 3 : 4;
    var gapM = 4;
    cardW = Math.floor((colW - gapM*(mobileCols-1)) / mobileCols);
    cardW = Math.max(64, Math.min(cardW, 100));
    cardH = Math.floor(cardW * 89 / 57);
  } else {
    var colH = col.clientHeight - 12;
    var centerH = centerArea ? centerArea.offsetHeight : 0;
    var availH = colH - centerH - 20; // 中段・gap分

    // 4列×3行に収める（12枚全部表示）
    var cols = 4, rows = 3;
    var gap = 2;
    cardW = Math.floor((colW - gap*(cols-1)) / cols);
    cardH = Math.floor((availH - gap*(rows-1)) / rows);
    // 57:89の比率を保つ
    var byW = Math.floor(cardW * 89 / 57);
    if(byW <= cardH){
      cardH = byW;
    } else {
      cardW = Math.floor(cardH * 57 / 89);
    }
    // 最大サイズを制限（12枚が常に見えるよう上限を設ける）
    var maxCardW = Math.floor((colW - gap*(cols-1)) / cols);
    var maxCardH = Math.floor(maxCardW * 89 / 57);
    if(cardW > maxCardW){ cardW = maxCardW; cardH = Math.floor(cardW * 89 / 57); }
    if(cardH > maxCardH){ cardH = maxCardH; cardW = Math.floor(cardH * 57 / 89); }
    cardW = Math.max(28, Math.min(cardW, 90));
    cardH = Math.max(44, Math.min(cardH, 141));
  }

  // CSSに適用
  var style = document.getElementById('hand-card-size-style');
  if(!style){
    style = document.createElement('style');
    style.id = 'hand-card-size-style';
    document.head.appendChild(style);
  }
  style.textContent =
    '#hand-area .card { width:'+cardW+'px !important; height:'+cardH+'px !important; }';
}
